<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAFESIGHT</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="Thu gọn menu">
        &#9776;
      </button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M12 2 21 6v6c0 5-9 10-9 10S3 17 3 12V6z" />
            <path d="m8 12 3 3 5-6" /></svg></span
        >SAFESIGHT
      </div>
      <div class="top-right">
        <span id="operator"></span>
        {% if current_user %} {% if current_user.is_admin %}<a
          class="top-btn"
          href="/accounts"
          >Tài khoản nhân viên</a
        >{% endif %}
        <form method="post" action="/logout">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}" /><button
            class="top-btn"
            type="submit"
          >
            Đăng xuất
          </button>
        </form>
        {% endif %}
        <span class="conn" id="conn"></span>
        <span id="clock"></span>
      </div>
    </header>
    <nav class="sidebar" id="sidebar" aria-label="Menu chính"></nav>
    <main id="main"></main>
    <dialog id="dlg"></dialog>
    <div class="toast" id="toast" role="status"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script id="detection-style" type="application/json">
      {{ detection_style|tojson }}
    </script>
    <script id="session-user" type="application/json">
      {{ current_user|tojson }}
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
